<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #2c3e50; }
    .box   { fill: #ffffff; stroke: #2c3e50; stroke-width: 1.5; rx: 6; }
    .boxhl { fill: #eef4fb; stroke: #2c6cb0; stroke-width: 2; rx: 6; }
    .lbl   { font-size: 13px; fill: #2c3e50; }
    .small { font-size: 11px; fill: #5d6d7e; }
    .edge  { stroke: #b03a2e; stroke-width: 7; fill: none; opacity: 0.75; }
    .thin  { stroke: #2c6cb0; stroke-width: 1.6; fill: none; }
    .glbl  { font-size: 10.5px; fill: #2c6cb0; }
    .rlbl  { font-size: 10.5px; fill: #b03a2e; }
  </style>
  <defs>
    <marker id="afat" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b03a2e" opacity="0.75"/>
    </marker>
    <marker id="athin" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#2c6cb0"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: transcript mode ================= -->
  <text x="120" y="28" class="title">Transcript mode</text>

  <g>
    <rect x="30" y="55"  width="110" height="34" class="box"/>
    <text x="85" y="76" text-anchor="middle" class="lbl">Worker 1</text>
    <rect x="30" y="105" width="110" height="34" class="box"/>
    <text x="85" y="126" text-anchor="middle" class="lbl">Worker 2</text>
    <rect x="30" y="155" width="110" height="34" class="box"/>
    <text x="85" y="176" text-anchor="middle" class="lbl">Worker 3</text>
    <text x="85" y="215" text-anchor="middle" class="lbl">&#8942;</text>
    <rect x="30" y="230" width="110" height="34" class="box"/>
    <text x="85" y="251" text-anchor="middle" class="lbl">Worker N</text>
  </g>

  <path d="M140,72  C 220,72  250,150 300,178" class="edge" marker-end="url(#afat)"/>
  <path d="M140,122 C 210,122 245,165 300,192" class="edge" marker-end="url(#afat)"/>
  <path d="M140,172 C 205,172 245,190 300,206" class="edge" marker-end="url(#afat)"/>
  <path d="M140,247 C 215,247 250,235 300,222" class="edge" marker-end="url(#afat)"/>
  <text x="196" y="105" class="rlbl">full transcript, ~2.9k chars each</text>

  <rect x="302" y="150" width="140" height="100" class="box" style="stroke-width:2.5"/>
  <text x="372" y="188" text-anchor="middle" class="lbl" style="font-weight:bold">Orchestrator</text>
  <text x="372" y="210" text-anchor="middle" class="small">context = N transcripts</text>
  <text x="372" y="226" text-anchor="middle" class="small">grows ~2.9k chars/worker</text>

  <text x="240" y="330" text-anchor="middle" class="small">Every worker added makes the</text>
  <text x="240" y="346" text-anchor="middle" class="small">orchestrator's context bigger.</text>
  <text x="240" y="362" text-anchor="middle" class="small">Two revisions of a fact sit in the pile</text>
  <text x="240" y="378" text-anchor="middle" class="small">with nothing marking which is current.</text>

  <!-- divider -->
  <line x1="480" y1="20" x2="480" y2="410" stroke="#d5dbdb" stroke-width="1"/>

  <!-- ================= RIGHT PANEL: graph mode ================= -->
  <text x="600" y="28" class="title">Graph mode</text>

  <g>
    <rect x="500" y="55"  width="100" height="30" class="box"/>
    <text x="550" y="74" text-anchor="middle" class="lbl">Worker 1</text>
    <rect x="500" y="100" width="100" height="30" class="box"/>
    <text x="550" y="119" text-anchor="middle" class="lbl">Worker 2</text>
    <rect x="500" y="145" width="100" height="30" class="box"/>
    <text x="550" y="164" text-anchor="middle" class="lbl">Worker 3</text>
    <text x="550" y="198" text-anchor="middle" class="lbl">&#8942;</text>
    <rect x="500" y="210" width="100" height="30" class="box"/>
    <text x="550" y="229" text-anchor="middle" class="lbl">Worker N</text>
  </g>

  <path d="M600,70  C 640,70  650,120 668,140" class="thin" marker-end="url(#athin)"/>
  <path d="M600,115 C 635,115 648,138 668,152" class="thin" marker-end="url(#athin)"/>
  <path d="M600,160 C 635,160 648,168 668,172" class="thin" marker-end="url(#athin)"/>
  <path d="M600,225 C 640,225 650,205 668,190" class="thin" marker-end="url(#athin)"/>
  <text x="608" y="96" class="glbl">3 typed claims each</text>

  <rect x="670" y="120" width="180" height="150" class="boxhl"/>
  <text x="760" y="140" text-anchor="middle" class="lbl" style="font-weight:bold">Shared graph</text>
  <rect x="685" y="152" width="86" height="24" class="box"/>
  <text x="728" y="168" text-anchor="middle" class="small">Claim v2</text>
  <rect x="685" y="205" width="86" height="24" class="box"/>
  <text x="728" y="221" text-anchor="middle" class="small">Claim v1</text>
  <line x1="728" y1="176" x2="728" y2="203" class="thin" marker-end="url(#athin)"/>
  <text x="736" y="194" class="glbl">supersedes</text>
  <rect x="780" y="235" width="60" height="24" class="box"/>
  <text x="810" y="251" text-anchor="middle" class="small">Source</text>
  <path d="M771,222 C 790,225 800,230 806,234" class="thin" marker-end="url(#athin)"/>
  <text x="836" y="228" text-anchor="middle" class="glbl">derived_from</text>

  <rect x="680" y="320" width="150" height="60" class="box" style="stroke-width:2.5"/>
  <text x="755" y="345" text-anchor="middle" class="lbl" style="font-weight:bold">Orchestrator</text>
  <text x="755" y="365" text-anchor="middle" class="small">context stays ~flat</text>
  <path d="M760,270 L 757,318" class="thin" marker-end="url(#athin)"/>
  <text x="770" y="298" class="glbl">bounded query: live claims only,</text>
  <text x="770" y="311" class="glbl">1 line per vendor</text>
</svg>
